erver {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50m;

    # --- SPA: раздать статику, все прочие пути отдать на index.html ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- API: reverse-proxy на Django (main_app) ---
    location /api/ {
        proxy_pass http://backend:8000;   # имя сервиса в docker-compose
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # request_id из логов фронта прокидывается в бэкенд для склейки (§9)
        proxy_set_header X-Request-Id $http_x_request_id;
    }

    # --- Медиа (uploads) — Django-папка MEDIA_ROOT, общий volume ---
    location /media/ {
        alias /var/www/media/;
        expires 7d;
    }

    # --- Кэширование хэшированных ассетов Vite ---
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
