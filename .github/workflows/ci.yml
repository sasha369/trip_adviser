name: CI

on:
    push:
        branches: [develop]
    pull_request:

jobs:
    frontend:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: frontend
        
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                node-version: 22
                cache: npm
                cache-dependency-path: frontend/package-lock.json
                
            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Test
              run: npm run test
            
            - name: Build
              run: npm run build

    backend:
        runs-on: ubuntu-latest
        services:
            db:
                image: postgres:16-alpine
                env:
                    POSTGRES_DB: django_db
                    POSTGRES_USER: user_db
                    POSTGRES_PASSWORD: ci-pass
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U user_db -d django_db"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                python-version: "3.12"
                cache: pip
                cache-dependency-path: requirements/dev.txt

            - name: Install dependencies
              run: pip install -r requirements/dev.txt

            - name: Check migrations
              run: python main_app/manage.py makemigrations --check --dry-run
              env:
                    DJANGO_SECRET: ci-secret
                    DB_ENGINE: django.db.backends.postgresql
                    DB_NAME: django_db
                    DB_USER: user_db
                    DB_PASSWORD: ci-pass
                    DB_HOST: 127.0.0.1
                    DB_PORT: 5432

            - name: Test
              run: python main_app/manage.py test
              env:
                DJANGO_SECRET: ci-secret
                DB_ENGINE: django.db.backends.postgresql
                DB_NAME: django_db
                DB_USER: user_db
                DB_PASSWORD: ci-pass
                DB_HOST: 127.0.0.1
                DB_PORT: 5432

    docker:
        runs-on: ubuntu-latest
        needs: [frontend, backend]
        steps:
            - uses: actions/checkout@v4

            - name: Build frontend image
              run: docker build -t tripadv-frontend ./frontend

            - name: Build backend image
              run: docker build --build-arg REQUIREMENTS_FILE=prod.txt -t tripadv-backend -f main_app/Dockerfile .